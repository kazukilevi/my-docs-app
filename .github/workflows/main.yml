name: Keep Streamlit Alive

on:
  schedule:
    # 日本時間の「4時間ごと（1時、5時、9時、13時、17時、21時）」に実行
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Dummy commit to keep alive
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo "$(date)" > keep_alive.txt
          git add keep_alive.txt
          git commit -m "Keep alive ping" || exit 0
          git push
